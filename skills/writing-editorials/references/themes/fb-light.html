<!DOCTYPE html>
<html lang="vi" data-theme="fb-light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#0e4b81" />
  <title><!-- PROBLEM_NAME --> — lời giải</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100..800&amp;display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.css" />
  <style>
    /* fb-light — polygon-light chrome recolored "like a feed": white islands
       (cards) on a gray canvas, soft borders, slight rounding, all-monospace.
       Header bar #0e4b81, cards #ffffff, canvas #e9edf2, border #d9dde3.
       Left bars: .toc + Observation → --accent; .meta + Lemma → --gold;
       Transformation → --success-text; .complexity → --warning-text.
       h1/h2 ::before glyphs (">" / "[+]") + collapse hooks: end of stylesheet.
       Do not mix with another theme. */
    :root,
    [data-theme="fb-light"] {
      --background: #e9edf2;
      --surface: #ffffff;
      --surface-muted: #f2f4f8;
      --header-bar: #0e4b81;
      --header-text: #ffffff;
      --text: #1c1e21;
      --text-muted: #65676b;
      --heading: #0e4b81;
      --text-inverse: #ffffff;
      --border: #d9dde3;
      --accent: #0e4b81;
      --link: #0e4b81;
      --selection: #0e4b81;
      --gold: #8a5a00;
      --success: #1a6b45;
      --success-bg: #e8f4ee;
      --success-text: #1a6b45;
      --warning-bg: #faf5ea;
      --warning-text: #6b4e16;
      --code-bg: #f2f4f8;
      --code-fg: #1c1e21;
      --wash-accent: rgba(14, 75, 129, 0.09);
      --wash-accent-soft: rgba(14, 75, 129, 0.05);
      --font: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, "Segoe UI Mono", monospace;
      --font-sans: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, "Segoe UI Mono", monospace;
      --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, "Segoe UI Mono", monospace;
      --shadow: 0 1px 2px rgba(16, 24, 40, 0.07);
      --radius: 10px;
      --bar-obs: #16a34a;
      --bar-lemma: #7c3aed;
      --bar-trans: #0891b2;
      --bar-comp: #ea580c;
      --bar-note: #dc2626;
    }

    * { box-sizing: border-box; }

    html {
      color-scheme: light;
      background: var(--background);
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    ::selection {
      background: color-mix(in oklab, var(--selection) 22%, transparent);
    }

    a { color: var(--link); }

    .bar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--header-bar);
      border-bottom: none;
    }

    .bar-inner {
      max-width: 60rem;
      margin: 0 auto;
      padding: 1rem 1.25rem;
      display: flex;
      align-items: baseline;
      gap: 0.85rem;
    }

    .bar-kicker {
      font-family: var(--font-sans);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--header-text);
      opacity: 0.78;
    }

    .bar-name {
      font-family: var(--font-sans);
      font-size: 1rem;
      font-weight: 700;
      color: var(--header-text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .page {
      max-width: 60rem;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 4.5rem;
    }

    mark {
      background: var(--wash-accent);
      color: var(--heading);
      padding: 0.05em 0.28em;
      border-radius: 4px;
      box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--accent) 26%, transparent);
    }

    .kicker {
      margin: 0 0 0.45rem;
      font-family: var(--font-sans);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
    }

    h1, h2, h3 {
      color: var(--heading);
      font-family: var(--font-sans);
      font-weight: 700;
      letter-spacing: 0;
      line-height: 1.3;
    }

    h1 {
      margin: 0 0 1.1rem;
      font-size: 1.7rem;
    }

    h2 {
      margin: 2.3rem 0 0.7rem;
      font-size: 1.08rem;
    }

    h3 {
      margin: 1.4rem 0 0.5rem;
      font-size: 0.98rem;
    }

    p { margin: 0.75em 0; }

    ul, ol {
      margin: 0.75em 0;
      padding-left: 1.25rem;
    }

    li + li { margin-top: 0.2rem; }

    .meta {
      display: grid;
      grid-template-columns: 9.5rem 1fr;
      gap: 0.45rem 1.15rem;
      margin: 0 0 1.1rem;
      padding: 0.9rem 1.05rem;
      border: 1px solid var(--border);
      border-left: 3px solid var(--gold);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .meta dt {
      margin: 0;
      font-family: var(--font-sans);
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--heading);
      letter-spacing: 0;
      text-transform: none;
    }

    .meta dd {
      margin: 0;
      color: var(--text);
      font-family: var(--font);
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin: 0 0 1.8rem;
      padding: 0;
      list-style: none;
    }

    td .tags {
      margin: 0;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
      background: var(--surface-muted);
      color: var(--text-muted);
      box-shadow: inset 0 0 0 1px var(--border);
      font-family: var(--font-sans);
      font-size: 0.72rem;
    }

    .panel {
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: var(--radius);
      padding: 1rem 1.05rem;
      margin: 1rem 0;
      box-shadow: var(--shadow);
    }

    .card {
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      background: var(--surface);
      border-radius: var(--radius);
      padding: 0.9rem 1rem 1rem;
      margin: 1.05rem 0;
      box-shadow: var(--shadow);
    }

    .card-label {
      margin: 0 0 0.45rem;
      font-family: var(--font-sans);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .card.lemma {
      border-left-color: var(--gold);
    }

    .card.transform {
      border-left-color: var(--success-text);
    }

    .card.lemma .card-label { color: var(--gold); }
    .card.transform .card-label { color: var(--success-text); }

    .card p:first-of-type { margin-top: 0; }
    .card p:last-child { margin-bottom: 0; }

    .bridge {
      margin: 1.3rem 0;
      padding: 0.15rem 0 0.15rem 1rem;
      border-left: 2px solid var(--accent);
      color: var(--text);
    }

    .toc {
      margin: 1.1em 0;
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .toc table {
      margin: 0;
    }

    .complexity {
      margin: 1.4rem 0;
      padding: 0.9rem 1rem;
      border: 1px solid var(--border);
      border-left: 3px solid var(--warning-text);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
      font-family: var(--font-mono);
    }

    .complexity .card-label {
      font-family: var(--font-sans);
      color: var(--warning-text);
    }

    .complexity .muted {
      color: var(--text-muted);
    }

    .fun {
      margin: 1.4rem 0;
      padding: 0.9rem 1rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--warning-bg);
      color: var(--warning-text);
      box-shadow: var(--shadow);
    }

    .fun .card-label { color: var(--warning-text); }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 1em 0;
      font-size: 0.88em;
    }

    th, td {
      border: 1px solid var(--border);
      padding: 0.4rem 0.6rem;
      text-align: left;
    }

    th {
      background: var(--surface-muted);
      font-family: var(--font-sans);
      font-weight: 700;
      color: var(--heading);
    }

    pre {
      background: var(--code-bg);
      color: var(--code-fg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      overflow-x: auto;
      font-family: var(--font-mono);
      font-size: 0.85em;
      line-height: 1.5;
    }

    :not(pre) > code {
      background: var(--surface-muted);
      padding: 0.1em 0.35em;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 0.9em;
    }

    .katex { font-size: 1.1em; color: var(--text); }
    .katex-display { overflow-x: auto; overflow-y: hidden; padding: 0.25rem 0; }

    .problem {
      margin: 4.5rem 0 0;
      padding: 2.5rem 0 0.5rem;
      border-top: 1px solid var(--border);
    }

    .problem h1 {
      margin-top: 0;
    }

    .subtask {
      margin: 2.3rem 0 0;
      padding: 0.35rem 0 0.25rem;
      border-top: 1px solid var(--border);
    }

    .subtask h2 { margin-top: 1.3rem; }

    svg { max-width: 100%; height: auto; display: block; margin: 1rem 0; }

    footer.page-end {
      margin-top: 3rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      color: var(--text-muted);
      font-family: var(--font-sans);
      font-size: 0.72rem;
    }

    @media print {
      * {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      html, body {
        margin: 0;
        background: var(--background);
      }
      @page {
        size: A4;
        margin: 0;
      }
      .bar { position: static; }
      .bar-inner,
      .page {
        max-width: none;
        padding-left: 14mm;
        padding-right: 14mm;
      }
      .page {
        padding-top: 8mm;
        padding-bottom: 10mm;
      }
      .katex-display,
      pre {
        overflow: visible;
      }
    }

    /* ---- header glyphs, weight scale, collapse hooks (fb-light) ---- */

    body { font-weight: 440; }
    strong, b { font-weight: 800; }

    h1, h2, h3, .bar-name, .bar-kicker, .kicker, .card-label,
    .meta dt, th { font-weight: 800; }

    h1::before {
      content: ">";
      display: inline-block;
      font-size: 1em;
      line-height: 1;
      margin-right: 0.4em;
      color: var(--accent);
      vertical-align: middle;
      translate: 0 -0.03em;
    }

    h2::before {
      content: "[+]";
      font-size: 1em;
      line-height: 1;
      margin-right: 0.42em;
      color: var(--accent);
      vertical-align: middle;
      translate: 0 -0.03em;
    }

    .problem > h1,
    h1.problem-title {
      cursor: pointer;
    }

    .problem > h1::before,
    h1.problem-title::before {
      transform: rotate(90deg);
      transition: transform 0.18s ease;
    }

    .problem.is-closed > h1::before,
    h1.problem-title.is-closed::before {
      transform: rotate(0deg);
    }

    .problem.is-closed > *:not(h1) {
      display: none;
    }

    .pt-body.is-closed {
      display: none;
    }

    .katex {
      -webkit-text-stroke: 0.02em currentColor;
    }

    @media print {
      .problem.is-closed > *:not(h1),
      .pt-body.is-closed {
        display: block !important;
      }
      .problem.is-closed > h1::before,
      h1.problem-title.is-closed::before {
        transform: rotate(90deg);
      }
    }

    /* ---- island left-bar type colors (fb-light) ----
       meta (time/mem/difficulty) → theme base blue
       observation / body cards   → bright leaf green
       transformation             → cyan
       time complexity            → vivid orange
       note / fun fact            → red
       lemma                      → violet
       toc                        → theme base blue
       Bars thickened to 6px so the type reads at a glance. */

    .meta,
    .toc {
      border-left-width: 6px;
    }

    .meta {
      border-left-color: var(--accent);
    }

    .card {
      border-left-width: 6px;
      border-left-color: var(--bar-obs);
    }

    .card .card-label {
      color: var(--bar-obs);
    }

    .card.lemma {
      border-left-color: var(--bar-lemma);
    }

    .card.lemma .card-label {
      color: var(--bar-lemma);
    }

    .card.transform {
      border-left-color: var(--bar-trans);
    }

    .card.transform .card-label {
      color: var(--bar-trans);
    }

    .complexity {
      border-left-width: 6px;
      border-left-color: var(--bar-comp);
    }

    .complexity .card-label {
      color: var(--bar-comp);
    }

    .fun,
    .note {
      border-left: 6px solid var(--bar-note);
    }

    .fun .card-label,
    .note .card-label {
      color: var(--bar-note);
    }

    /* ---- paragraph guide dot (fb-light) ----
       Small faint dot hanging in the left gutter before each top-level prose
       paragraph, so the eye can track which passage it has reached. The dot
       sits OUTSIDE the text flow (absolute, negative left) and never pushes
       the paragraph text inward. Equation-only paragraphs (a lone \katex-display)
       are skipped. */

    .page section > p:not(:has(.katex-display)) {
      position: relative;
    }

    .page section > p:not(:has(.katex-display))::before {
      content: "\00b7";
      position: absolute;
      left: -1.05em;
      top: 0;
      transform: translateY(0.42em);
      font-size: 0.9em;
      line-height: 1;
      color: var(--text-muted);
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div class="bar">
    <div class="bar-inner">
      <span class="bar-kicker">Lời giải</span>
      <span class="bar-name"><!-- PROBLEM_NAME --></span>
    </div>
  </div>

  <main class="page">
    <h1 class="problem-title"><!-- PROBLEM_NAME --></h1>

    <div class="pt-body">

    <dl class="meta">
      <dt>Time limit</dt>
      <dd><!-- TIME_LIMIT e.g. 2 s --></dd>
      <dt>Memory limit</dt>
      <dd><!-- MEMORY_LIMIT e.g. 256 MB --></dd>
      <dt>Expected rating</dt>
      <dd><!-- EXPECTED_RATING e.g. 2100 — no leading * --></dd>
    </dl>

    <ul class="tags">
      <!-- <li class="tag">data structures</li> -->
    </ul>

    <section id="statement">
      <h2>Tóm tắt đề bài</h2>
      <!-- Lore-stripped restatement. Highlight load-bearing facts with <mark>.
           Order: restatement → <strong>Yêu cầu:</strong> → <strong>Giới hạn:</strong>
           → Subtask 1, 2, … . Wording follows references/vi-glossary.md
           (đơn đồ thị, never đồ thị đơn). Do not name OI/IOI/ICPC. -->
      <p><!-- restatement --></p>
      <p><strong>Yêu cầu:</strong> <!-- what to compute --></p>
      <p><strong>Giới hạn:</strong></p>
      <ul>
        <li><!-- bounds --></li>
      </ul>
      <!-- <p><strong>Subtask:</strong></p>
      <ul>
        <li>Subtask 1 (… điểm): …</li>
      </ul> -->
    </section>

    <section id="tutorial">
      <h2>Lời giải</h2>
      <!-- One reasoning step per <p>; the theme marks each step with a guide dot.
           Cards only for pivotal claims; bridges between complexity jumps.
           No pseudocode / algorithm box. A displayed recurrence or matrix is fine. -->
      <article class="card">
        <p class="card-label">Nhận xét 1</p>
        <p>Thay nội dung mẫu này.</p>
      </article>
    </section>

    <!-- Subtasks only: one <section class="subtask" id="g1"> per rung, each with its own complexity. -->

    <section id="complexity">
      <h2>Độ phức tạp</h2>
      <div class="complexity">
        <p class="card-label">Độ phức tạp</p>
        <p>Thời gian: \(O(\ldots)\) <span class="muted">non-amortized</span></p>
        <p>Bộ nhớ: \(O(\ldots)\)</p>
      </div>
      <!-- Never <pre class="complexity">: KaTeX does not render inside <pre>.
           Drop query/update lines when they do not apply. -->
    </section>

    <!-- Optional other approaches. Delete the whole section if none.
    <section id="other">
      <h2>Cách giải khác</h2>
      <p>…</p>
    </section>
    -->

    <!-- Fun fact: emit this section ONLY if the user asked. Delete otherwise.
    <section id="fun" class="fun">
      <p class="card-label">Thông tin thú vị</p>
      <p>…</p>
    </section>
    -->

    </div>

    <footer class="page-end"><!-- PROBLEM_NAME --> · lời giải</footer>
  </main>

  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/contrib/auto-render.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      if (window.renderMathInElement) {
        renderMathInElement(document.body, {
          delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "\\[", right: "\\]", display: true },
            { left: "$", right: "$", display: false },
            { left: "\\(", right: "\\)", display: false }
          ],
          throwOnError: false
        });
      }
    });
  </script>
  <script>
    (function () {
      function onReady(fn) {
        if (document.readyState !== "loading") fn();
        else document.addEventListener("DOMContentLoaded", fn);
      }
      onReady(function () {
        var titles = document.querySelectorAll("section.problem > h1, h1.problem-title");
        Array.prototype.forEach.call(titles, function (h1) {
          h1.addEventListener("click", function () {
            if (window.getSelection && window.getSelection().toString().length > 0) return;
            var closed = h1.classList.toggle("is-closed");
            h1.setAttribute("aria-expanded", closed ? "false" : "true");
            var body = h1.nextElementSibling;
            if (body && body.classList && body.classList.contains("pt-body")) {
              body.classList.toggle("is-closed", closed);
            }
            var sec = h1.parentElement;
            if (sec && sec.classList && sec.classList.contains("problem")) {
              sec.classList.toggle("is-closed", closed);
            }
          });
        });
      });
    })();
  </script>
</body>
</html>
