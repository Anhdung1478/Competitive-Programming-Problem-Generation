# Rigor profile for the problem-preparation workflow in the
# `creating-problems` skill.
#
# `heavy` is that skill exactly as written — the full workflow, no shortcuts.
# `light-weight` is a set of overrides layered on top of it for quick,
# low-stakes generation. Anything not listed under a profile's `overrides`
# still follows the skill unchanged. This file never redefines a step; it
# only says which parts of its rigor may be relaxed.

default: heavy

profiles:
  heavy:
    description: >
      Careful generation for both the solution suite and the test data.
      Follow the `creating-problems` skill exactly as written. Use whenever the package is
      headed for real contestants, grading, or anything the user did not
      explicitly call quick/rough/draft.
    overrides: {}

  light-weight:
    description: >
      Quick generation for drafting or iteration. Trades validation depth
      and candidate coverage for speed. Still produces a working package —
      it just gathers less evidence before calling something correct, and
      skips artifacts that only exist to stress-test WA/TLE candidates that
      this profile does not generate in the first place.

    never_relaxed:
      - "Step 1's hard stop on a confirmed compile error, correctness defect, complexity violation, or overflow risk — a found defect still blocks Step 2-8 in both profiles."
      - "source-of-truth precedence and the no-edit rule for source/problem-context.md and source/solution.cpp."
      - "the C++ I/O convention (no scanf/printf/etc.) in every generated C++ file."
      - "the mandatory ambiguity gate: still ask before guessing a fact that changes correctness."
      - "Step 3's checker decision is recorded in `outputs/problem.json` in both profiles. Non-unique, optimization, or special-protocol output always gets a written `outputs/checker.cpp`; only an output that is unique for every valid input and that a listed `std::` token compares exactly may go stock."
      - "Step 0's separation table, and its two blocking findings — the problem is already known, and the ladder collapses or the intended solution is not needed. Both stop for the user in both profiles."
      - "Step 5's input validator: it is written in both profiles, and every generated test must be accepted by it."
      - "Step 5b's example outputs: every outputs/example-test/*.out is the verbatim output of a validated solution, never hand-written, in both profiles."

    overrides:
      step0_shaping:
        - "The originality verdict may be one sentence from recall rather than a systematic archive pass. It is still stated either way."
        - "Where `problem-context.md` states no point weights, propose a split and proceed under a stated assumption instead of blocking on approval."

      step1_validate_solution:
        - "A quick compile plus a targeted sample/edge-case pass is enough; a full brute-force/differential sweep is optional unless a brute force is cheap to write for this problem."

      step3_checker:
        - "Lean toward a stock token whenever the statement plausibly implies unique output; do not spend effort on a careful deterministic/non-unique/optimization classification pass. Ask only if it is genuinely unclear whether output is unique."

      step4_solution_suite:
        - "Generate exactly one full-scope AC solution (the workflow already skips subtask-scoped AC by default in both profiles). Skip WA and TLE candidates too, unless the user asks for them or the problem invites an obvious, cheap-to-write one."
        - "Validate that one AC with hand-picked/sample cases and a couple of edge cases; a full differential/brute-force sweep is optional."

      step5_validator:
        - "Still write the validator in full — it defines the legal input domain the later steps must respect. The invalid-mutation rejection sweep may be reduced to a few spot checks (one bound violation, one malformed layout) instead of covering every mutation class."

      step5b_example_tests:
        - "Write exactly one example test (test_1.inp/.out) instead of weighing whether a second earns its place. Its .out is still produced by running the validated solution, and it is still accepted by the validator — neither is relaxed."

      step6_generator_config:
        - "Record input schema, bounds, and 3-5 generation profiles (small, large/near-limit, edge case). Omit the solution-kill matrix when there are no WA/TLE candidates to kill."

      step7_test_script_and_gentest:
        - "Script: keep the default 100 generated tests. The 50%-at-rate>=0.90 split and the [0.70,0.80)/[0.80,0.90) coverage requirement are relaxed to 'at least one small test and one near-limit test per subtask'."
        - "Generator: skip adversarial profiles that exist only to kill WA/TLE candidates from the solution-kill matrix, since light-weight does not generate those candidates. Structural invariants and subtask-scope enforcement still apply in full. Running the validator over every generated test is never relaxed."

      step8_editorial:
        - "A concise editorial covering the algorithm, complexity, and one worked example is sufficient. Full proof-level derivation of every step is optional."

      cross_artifact_gate:
        - "Still check bounds/format/subtask consistency across all produced files. Skip the WA/TLE-to-test-coverage cross-check, since light-weight does not produce WA/TLE candidates."

      step9_upload:
        - "Nothing is relaxed. The upload mirrors the finished package in both profiles."

selection:
  - "Use the profile the user names explicitly (e.g. 'light-weight', 'heavy', 'quick', 'careful')."
  - "Words like quick, draft, rough, just generate, prototype -> light-weight."
  - "Words like careful, thorough, for the real contest, double-check, or no urgency signal at all -> heavy (this file's default)."
  - "If it is genuinely ambiguous which profile is wanted, ask once instead of guessing."
  - "State the active profile at the start of the work and again in the final summary."

# Defaults for the optional `uploading-to-polygon` skill. They apply only when a
# package is pushed to Codeforces Polygon; the rigor profiles above do not
# change them.
polygon:
  # Total score of the problem, split equally over the non-sample tests
  # (100 points / 100 generated tests = 1 point each). Sample tests are never
  # graded: they stay at 0 points. Tests are ungrouped.
  #
  # `subtasks[].points` in outputs/problem.json must sum to this value, but those
  # weights are statement prose only — they are never uploaded as Polygon group
  # points. Polygon awards by tests passed.
  total_points: 100
