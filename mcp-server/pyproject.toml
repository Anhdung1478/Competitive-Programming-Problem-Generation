[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cp-polygon-mcp"
version = "0.1.0"
description = "MCP server for Codeforces Polygon, sized for the cp-problem-generation uploading-to-polygon skill: statements, files, solutions, tests, points, packages"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2,<2",
    "httpx>=0.27",
]

[project.scripts]
polygon-mcp = "polygon_mcp.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["src/polygon_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
